# LiveKit dev config (docker-compose.dev). Keys match LIVEKIT_API_KEY=devkey.
port: 7880
bind_addresses:
  - "0.0.0.0"

keys:
  devkey: secret

webhook:
  api_key: devkey
  urls:
    - http://app:8000/api/livekit/webhook

rtc:
  udp_port: 7882
  tcp_port: 7881

turn:
  enabled: false

logging:
  level: info
