# alg-rf.ru — ЭТАП 2 (с HTTPS). Отдельный файл: настройки hovial (default.conf) не меняются.
server {
    listen 80;
    server_name alg-rf.ru www.alg-rf.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://alg-rf.ru$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name alg-rf.ru www.alg-rf.ru;

    ssl_certificate     /etc/letsencrypt/live/alg-rf.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alg-rf.ru/privkey.pem;

    if ($host = www.alg-rf.ru) { return 301 https://alg-rf.ru$request_uri; }

    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Адрес контейнера ищется при каждом запросе: если сайт остановлен,
    # nginx (и hovial вместе с ним) всё равно запустится.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $alg_site http://alg-rf-site:80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect http://$host/ https://$host/;

    location ~* \.(?:webp|jpe?g|png|svg|ico|pdf|woff2)$ { proxy_pass $alg_site; expires 30d; }
    location ~* \.(?:css|js)$ { proxy_pass $alg_site; expires 1h; }
    location / { proxy_pass $alg_site; }
}
