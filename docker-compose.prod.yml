services:
  app:
    image: svorobyev201/hovial:latest
    restart: always
    environment:
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      YC_BUCKET: ${YC_BUCKET}
      YC_REGION: ${YC_REGION}
      YC_ACCESS_KEY_ID: ${YC_ACCESS_KEY_ID}
      YC_SECRET_ACCESS_KEY: ${YC_SECRET_ACCESS_KEY}
      ROBOKASSA_LOGIN: ${ROBOKASSA_LOGIN}
      ROBOKASSA_PASSWORD1: ${ROBOKASSA_PASSWORD1}
      ROBOKASSA_PASSWORD2: ${ROBOKASSA_PASSWORD2}
      APP_URL: ${APP_URL}
      COOKIE_SECURE: ${COOKIE_SECURE}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      REDIS_HOST: redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://hovial.com}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://hovial.com/livekit}
      LIVEKIT_API_HOST: ${LIVEKIT_API_HOST:-http://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      - db
      - redis
      - livekit

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: materiamedica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: materiamedica
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    volumes:
      - redis_data:/data

  livekit:
    image: livekit/livekit-server:latest
    restart: always
    command: --config /etc/livekit.yaml
    environment:
      # LiveKit reads its API key/secret pair from this var: "<key>: <secret>"
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      # Signaling (7880) is reverse-proxied by nginx at /livekit, but media
      # (RTC) cannot pass through an HTTP proxy and must be reachable directly.
      - "7881:7881"        # RTC over TCP (fallback)
      - "7882:7882/udp"    # RTC over UDP (primary media transport)
      - "5349:5349"        # embedded TURN over TLS
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-webroot:/var/www/certbot
    depends_on:
      - app
      - livekit

volumes:
  postgres_data:
  redis_data: